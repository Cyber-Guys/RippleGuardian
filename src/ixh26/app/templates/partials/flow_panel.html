{% from "partials/icons.html" import icon %}
<section class="panel" {{ attrs|default("") }}>
  <div class="panel-head">
    <h2>{{ title }}</h2>
    <div class="actions">
      <span class="small muted">{{ subtitle }}</span>
      <button class="btn btn-quiet btn-small" hx-get="/ui/flow/{{ trace_id }}" hx-target="#flow-{{ trace_id }}" hx-swap="outerHTML">{{ icon("radar") }} Replay</button>
      {% if link %}<a class="btn btn-small" href="{{ link }}">Open</a>{% endif %}
    </div>
  </div>
  {% include "partials/flow.html" %}
  <div class="chart-legend">
    <span><i style="background: #fff; box-shadow: inset 0 0 0 1px var(--hairline-strong)"></i>Victim</span>
    <span><i style="background: #7f8ba3"></i>Pass-through</span>
    <span><i style="background: var(--danger-ink)"></i>Funds stopped / known entity</span>
    <span><i style="background: var(--ripple)"></i>Band width = stolen value</span>
  </div>
</section>
