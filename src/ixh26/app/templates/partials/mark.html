{# Ripple Guardian mark: a shield holding a ledger node whose ripples spread out. Original artwork. #}
{% set mid = mark_id|default("m") %}
<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
  <defs><clipPath id="rg-{{ mid }}"><path d="M16 4.5 25.5 8.2V15c0 5.9-4 10.4-9.5 12.5C10.5 25.4 6.5 20.9 6.5 15V8.2Z"/></clipPath></defs>
  <rect width="32" height="32" rx="9" fill="#0b1220"/>
  <g clip-path="url(#rg-{{ mid }})" fill="none" stroke="#5ea2f5">
    <circle cx="16" cy="21" r="6.5" stroke-width="1.6"/>
    <circle cx="16" cy="21" r="10.5" stroke-width="1.3" opacity=".6"/>
    <circle cx="16" cy="21" r="14.5" stroke-width="1.1" opacity=".3"/>
  </g>
  <circle cx="16" cy="21" r="2.6" fill="#5ea2f5"/>
  <path d="M16 4.5 25.5 8.2V15c0 5.9-4 10.4-9.5 12.5C10.5 25.4 6.5 20.9 6.5 15V8.2Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
