{% extends "base.html" %}
{% block body %}
<div class="auth">
  <div class="auth-rings" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="auth-card">
    <section class="auth-story">
      <img class="auth-logo" src="/static/logo.png" alt="Ripple Guardian" width="140" height="140">
      <h1>Know the moment your wallet moves</h1>
      <p>Live protection for XRP Ledger wallets. If yours is drained, we show you where the money went.</p>
      <p class="small">XRPL {{ network|capitalize }}. Username only, no personal data.</p>
    </section>
    <section class="auth-form">
      {% block form %}{% endblock %}
    </section>
  </div>
</div>
{% endblock %}
