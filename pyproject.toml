[project]
name = "ixh26"
version = "0.1.0"
description = "XRPL wallet guardian: monitoring and haircut taint tracking of stolen funds (IXH26 Track 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "xrpl-py>=5.1",
]

[project.scripts]
ixh26 = "ixh26.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: hits XRPL Testnet (run with `make test-network`)"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
