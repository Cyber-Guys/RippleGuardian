# Local stack: API + worker + Postgres + Redis. Testnet only (CLAUDE.md §5).
x-app: &app
  build: .
  image: ixh26-guardian:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://ixh26:${POSTGRES_PASSWORD:-ixh26}@db:5432/ixh26
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./artifacts:/app/artifacts
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["ixh26", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["ixh26", "worker"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ixh26
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixh26}  # local dev only; override in .env
      POSTGRES_DB: ixh26
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ixh26 -d ixh26"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
